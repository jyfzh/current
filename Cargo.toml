[package]
name = "current"
version = "0.1.0"
edition = "2024"
authors = ["jiangyufeng"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
worker-macros = { version = "0.8" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
feed-rs = "2"
uuid = { version = "1", features = ["js"] }
chrono = { version = "0.4", features = ["wasmbind"] }
md-5 = "0.10"
url = "2"
futures = "0.3"
